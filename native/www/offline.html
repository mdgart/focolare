<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Focolare — offline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 2rem 1.5rem calc(2rem + env(safe-area-inset-bottom));
    font: 16px/1.5 ui-serif, Georgia, serif;
    background: #FBF7F0; color: #2E2A26;
  }
  @media (prefers-color-scheme: dark) { body { background: #1C1917; color: #E7E2DA; } }
  .card { max-width: 24rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.25rem; opacity: .8; }
  button {
    font: inherit; font-size: .95rem; padding: .6rem 1.4rem; border-radius: 999px;
    border: 0; background: #A8452A; color: #FFF8F0; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>No connection</h1>
    <!--
      Phase 3 replaces this with a reduced cook screen driven by the durable
      snapshot in Preferences, so losing signal mid-recipe doesn't lose the
      cook. Until then this is honest about what it can and can't do.
    -->
    <p>Focolare needs the network to load. Any timer you already started will still ring.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
